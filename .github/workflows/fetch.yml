name: Fetch jobs
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python fetch_jobs.py
      - run: python fetch_funding.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add jobs.json funding.json && (git commit -m "Update jobs" && git push) || echo "no changes"
