<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>My job board</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2421;--mute:#667069;--line:#dde2db;--acc:#1f6f5c;--new:#c2410c}
@media(prefers-color-scheme:dark){:root{--bg:#141917;--card:#1c2320;--ink:#e8ece9;--mute:#97a39c;--line:#2d3732;--acc:#5cc2a8;--new:#fb923c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
header{padding:20px 16px 8px;max-width:760px;margin:auto}h1{margin:0;font-size:1.5rem}
#meta{color:var(--mute);font:13px system-ui}
.bar{max-width:760px;margin:auto;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;font:14px system-ui}
.bar input[type=search],.bar select{flex:1 1 160px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.bar label{display:flex;align-items:center;gap:6px}
main{max-width:760px;margin:auto;padding:0 16px 40px}
.job{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.job.new{border-left:4px solid var(--new)}.job h2{margin:0 0 2px;font-size:1.05rem}
.job h2 a{color:var(--ink);text-decoration:none}.job h2 a:hover{text-decoration:underline}
.sub{color:var(--mute);font:13px system-ui}
.tag{display:inline-block;margin:6px 6px 0 0;padding:2px 8px;border-radius:99px;border:1px solid var(--line);font:12px system-ui}
.tag.good{color:var(--acc);border-color:var(--acc)}.tag.n{color:var(--new);border-color:var(--new)}
.acts{margin-top:10px;display:flex;gap:6px;font:13px system-ui}
.acts button{padding:6px 12px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;cursor:pointer}
.acts button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.bar button,.bar .btn{padding:8px 12px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;cursor:pointer;font:14px system-ui}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body>
<header><h1>My job board</h1><div id="meta">Loading…</div><a href="outreach.html" style="font:14px system-ui;color:var(--acc)">Cold outreach</a></header>
<div class="bar"><input type="search" id="q" placeholder="Search title or company">
<select id="st"><option value="active">Active</option><option value="new">New only</option><option value="saved">Saved</option><option value="applied">Applied</option><option value="skip">Skipped</option></select>
<select id="el"><option value="hide">Hide excluded</option><option value="confirmed">Confirmed only</option><option value="verify">Needs verification</option><option value="excluded">Excluded</option><option value="all">All</option></select>
<select id="so"><option value="new">Newest first</option><option value="best">Best match first</option></select></div>
<div class="bar"><button id="exp">Export my tracking</button><label class="btn">Import tracking<input type="file" id="imp" accept="application/json" hidden></label></div>
<main id="list"></main>
<script>
const $=id=>document.getElementById(id);let jobs=[];
const ago=d=>{const n=Math.floor((Date.now()-new Date(d))/864e5);return n<=0?"today":n===1?"1 day ago":n+" days ago"};
const el=j=>j.eligibility||(j.open?"confirmed":"verify");
const store=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let status=store("status")||{};const last=store("lastVisit")||"";
let tracked=store("tracked")||{},all=[];
// <merge>
function mergeTracked(jobs,status,tracked){
  const keep=u=>status[u]==="saved"||status[u]==="applied";
  const t={};Object.keys(tracked||{}).forEach(u=>{if(keep(u)&&tracked[u]&&tracked[u].job)t[u]=tracked[u]});
  const cur=new Set(jobs.map(j=>j.url));
  jobs.forEach(j=>{if(keep(j.url))t[j.url]={job:j,at:(t[j.url]||{}).at||new Date().toISOString()}});
  const gone=Object.keys(t).filter(u=>!cur.has(u)).map(u=>Object.assign({},t[u].job,{gone:true}));
  return {all:jobs.concat(gone),tracked:t};
}
// </merge>
function refresh(){const m=mergeTracked(jobs,status,tracked);all=m.all;tracked=m.tracked;store("tracked",tracked);draw()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function draw(){
 const q=$("q").value.toLowerCase(),f=$("st").value,e=$("el").value;
 const sv=["saved","applied"].includes(f);
 const rows=all.filter(j=>{const s=status[j.url]||"";
  if(!sv&&e==="hide"&&el(j)==="excluded")return false;
  if(!sv&&["confirmed","verify","excluded"].includes(e)&&el(j)!==e)return false;
  if(q&&!(j.title+" "+j.company).toLowerCase().includes(q))return false;
  if(f==="active")return s!=="skip";if(f==="new")return j.first_seen>last&&s!=="skip";return s===f});
 if($("so").value==="new")rows.sort((a,b)=>b.posted.localeCompare(a.posted)||b.score-a.score);
 $("list").innerHTML=rows.map(j=>{const s=status[j.url]||"",isNew=j.first_seen>last;
  return `<div class="job ${isNew?"new":""}"><h2><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h2>
  <div class="sub">${esc(j.company)} · ${esc(j.location||"Remote")} · posted ${ago(j.posted)}</div>
  ${{confirmed:'<span class="tag good">Confirmed: open to Nigeria</span>',verify:'<span class="tag">Verify location</span>',excluded:'<span class="tag n">Excluded</span>'}[el(j)]}${j.conflict?'<span class="tag n">Conflicting evidence</span>':''}
  ${j.gone?'<span class="tag n">No longer listed</span>':''}${j.direct?'<span class="tag good">Direct from employer</span>':''}${j.salary_hint?'<span class="tag">Pay listed</span>':''}${isNew?'<span class="tag n">New</span>':''}<span class="tag">${esc(j.source)}</span>${j.source==="Reddit"?'<span class="tag n">Unverified: check the poster</span>':''}
  ${(j.evidence||[]).length?`<div class="sub">${j.evidence.map(esc).join(" · ")}</div>`:""}
  <div class="acts">${["saved","applied","skip"].map(a=>`<button class="${s===a?"on":""}" data-u="${esc(j.url)}" data-a="${a}">${a==="skip"?"Skip":a[0].toUpperCase()+a.slice(1)}</button>`).join("")}</div></div>`}).join("")||'<p class="sub">Nothing here yet. Run the workflow or change filters.</p>';
}
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;const u=b.dataset.u;status[u]=status[u]===b.dataset.a?"":b.dataset.a;store("status",status);refresh()};
$("exp").onclick=()=>{const b=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),status,tracked,prof:store("prof"),out:store("out")},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="jobboard-tracking.json";document.body.appendChild(a);a.click();a.remove()};
$("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(d.version!==1)throw 0;if(!confirm("Merge this backup into your current tracking?"))return;status=Object.assign({},status,d.status||{});tracked=Object.assign({},tracked,d.tracked||{});store("status",status);if(d.prof)store("prof",Object.assign({},store("prof")||{},d.prof));if(d.out)store("out",Object.assign({},store("out")||{},d.out));refresh()}).catch(()=>alert("That file is not a valid backup."))};
["q","st","el","so"].forEach(i=>$(i).oninput=draw);
fetch("jobs.json?t="+Date.now()).then(r=>r.json()).then(d=>{jobs=d.jobs;
 $("meta").textContent=`${jobs.filter(j=>el(j)!=="excluded").length} jobs${jobs.some(j=>el(j)==="excluded")?" (+"+jobs.filter(j=>el(j)==="excluded").length+" excluded)":""} · updated ${d.updated?new Date(d.updated).toLocaleString():"never"}`;refresh();
 store("lastVisit",new Date().toISOString().slice(0,10))}).catch(()=>$("meta").textContent="Could not load jobs.json");
</script></body></html>
